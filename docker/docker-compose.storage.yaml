services:
  minio:
    image: pgsty/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_dev:/data
    networks:
      - comandas-network
    restart: on-failure

volumes:
  minio_data_dev:

networks:
  comandas-network:
    name: comandas-network