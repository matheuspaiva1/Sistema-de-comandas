services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - mongo
      - minio
    networks:
      - comandas-network
    # Bind mount para desenvolvimento com hot reload (descomente para usar)
    volumes:
      - ../:/app
    restart: unless-stopped

networks:
  comandas-network:
    name: comandas-network